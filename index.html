<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه حقیقت علمی | شبکه ویدیویی نسل جدید</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center border-b border-slate-700">
        <h1 class="text-2xl font-bold text-blue-400">پایگاه حقیقت علمی</h1>
        <button id="connectWallet" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full transition">
            اتصال کیف پول
        </button>
    </header>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center text-center p-10">
        <h2 class="text-5xl font-extrabold mb-6">آینده آموزش، غیرمتمرکز است.</h2>
        <p class="text-slate-400 mb-10 max-w-2xl">در اینجا محتوای علمی شما به NFT تبدیل شده و حق امتیاز آن برای همیشه متعلق به شماست.</p>
        
        <div class="flex gap-4">
            <button class="bg-white text-blue-900 px-8 py-3 rounded-lg font-bold">شروع تماشا</button>
            <button class="border border-slate-500 px-8 py-3 rounded-lg hover:bg-slate-800">آپلود ویدیو</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-slate-500 text-sm">
        تمامی حقوق برای پایگاه حقیقت علمی محفوظ است.
    </footer>

    <script>
        // در آینده اینجا کدهای اتصال به متامسک (Web3) را اضافه می‌کنیم
        document.getElementById('connectWallet').addEventListener('click', () => {
            alert("به زودی: اتصال به کیف پول MetaMask پیاده‌سازی می‌شود.");
        });
    </script>
</body>
</html>
